name: DevSecOps Pipeline

on:
  push:
    branches: [ "devsecops-remediation" ]
  pull_request:
    branches: [ "devsecops-remediation" ]

jobs:
  # Stage 1: Secret Scanning
  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          # We use the baseline to ignore old secrets in history
          GITLEAKS_CONFIG: .gitleaks.toml 

  # Stage 2: SAST (Static Analysis)
  sast:
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - uses: actions/checkout@v3
      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: "auto"

  # Stage 3: SCA (Dependency Scanning)
  sca:
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v3
      - name: Trivy Dependency Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # Stage 4: Container Build, Scan & SBOM
  container-security:
    runs-on: ubuntu-latest
    needs: sca
    steps:
      - uses: actions/checkout@v4

      # 0. Force GitHub username to lowercase (Docker requires lowercase)
      - name: Set lowercase owner name
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      
      # 1. Build all three images
      - name: Build Images
        run: |
          docker build -t secureflow-auth:latest ./services/auth-service
          docker build -t secureflow-frontend:latest ./services/frontend
          docker build -t secureflow-transaction:latest ./services/transaction-service
      
      # 2. Scan Auth Service for Critical CVEs
      - name: Trivy Image Scan (Auth)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secureflow-auth:latest'
          severity: 'CRITICAL'
          exit-code: '1'
      
      # 3. Scan Frontend Service for Critical CVEs
      - name: Trivy Image Scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secureflow-frontend:latest'
          severity: 'CRITICAL'
          exit-code: '1'
          
      # 4. Scan Transaction Service for Critical CVEs
      - name: Trivy Image Scan (Transaction)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secureflow-transaction:latest'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
      
      # 5. Generate SBOM (Software Bill of Materials)
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: secureflow-auth:latest
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
      
      # 6. Keyless Image Signing with Cosign
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      
      - name: Push and Sign All Images
        run: |
          for svc in auth frontend transaction; do
            docker tag secureflow-$svc:latest ghcr.io/${{ env.OWNER_LC }}/secureflow-$svc:latest
            docker push ghcr.io/${{ env.OWNER_LC }}/secureflow-$svc:latest
            cosign sign --yes ghcr.io/${{ env.OWNER_LC }}/secureflow-$svc:latest
          done

  # Stage 5: IaC Scanning
  iac-security:
    runs-on: ubuntu-latest
    needs: container-security
    steps:
      - uses: actions/checkout@v3
      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          # We will filter for criticals later
          quiet: false 
      - name: TODO - Tune Checkov
        run: echo "Phase 4 will tune Checkov for zero criticals"

  # Stage 6: DAST (Dynamic Analysis)
  dast:
    runs-on: ubuntu-latest
    needs: iac-security
    steps:
      - uses: actions/checkout@v3
      - name: TODO - Run DAST
        run: echo "Phase 7 will add OWASP ZAST here"

  # Stage 7: Deploy & Runtime Security
  deploy-runtime:
    runs-on: ubuntu-latest
    needs: dast
    steps:
      - uses: actions/checkout@v3
      - name: TODO - Deploy with Vault & Falco
        run: echo "Phase 6 will add Vault, Falco, and Gatekeeper checks here"